# ==========================================
# muse2api Nginx Reverse Proxy Example
# ==========================================
# Important: Increase proxy_read_timeout and disable proxy_buffering for SSE streaming
# ==========================================

server {
    listen 80;
    server_name your-domain.com; # Replace with your domain or IP

    # Allow reference image uploads for image-to-image / video generation
    client_max_body_size 64M;

    location / {
        proxy_pass http://127.0.0.1:18610;

        # Image and video generation can take 30-120s; prevent 502 Bad Gateway timeouts
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 60s;

        # Disable buffering for zero-latency SSE streaming on /v1/chat/completions
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
